<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#142b48"><title>訓練評価ナビ</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:#17283b;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:#142b48;color:white;padding:24px 18px 18px}h1{font-size:23px;margin:0 0 5px}header small{opacity:.8}.wrap{max-width:720px;margin:auto;padding:15px}.panel{background:white;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #16283c0c}.top{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.days{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}.days button{padding:12px 4px;background:#e9eff6;color:#30455d}.days button.active{background:#225fa8;color:white}button{border:0;border-radius:10px;padding:10px 13px;font-weight:700;cursor:pointer;background:#225fa8;color:white}button.secondary{background:#e9eff6;color:#29415b}button.danger{background:#ffedf0;color:#b22743}.bar{height:11px;background:#e5ebf2;border-radius:20px;overflow:hidden;margin:10px 0}.fill{height:100%;background:#279b79;width:0;transition:width .2s}.item{display:flex;gap:11px;padding:14px 0;border-bottom:1px solid #e9edf2}.item:last-child{border-bottom:0}.item input[type=checkbox]{width:23px;height:23px;accent-color:#239a77;flex-shrink:0}.itemmain{flex:1;min-width:0}.meta{color:#60758b;font-size:13px}.itemtitle{font-weight:700;margin:4px 0;overflow-wrap:anywhere}.done .itemtitle{text-decoration:line-through;color:#8995a3}.tag{font-size:11px;background:#edf3fb;padding:3px 7px;border-radius:6px}.itembuttons{display:flex;gap:5px;margin-top:8px}.itembuttons button{font-size:12px;padding:6px 9px}label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}input,select,textarea{font:inherit;width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px;background:white}textarea{min-height:65px}dialog{border:0;border-radius:18px;width:min(94vw,480px);max-height:90vh;overflow:auto;padding:20px}dialog::backdrop{background:#10223899}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:17px}.muted{color:#697b8d;font-size:13px}.empty{text-align:center;padding:25px 0;color:#77869a}.tools{display:flex;flex-wrap:wrap;gap:8px}footer{font-size:12px;color:#697b8d;padding:4px 0 25px}strong{font-variant-numeric:tabular-nums}</style></head><body><header><div style="max-width:720px;margin:auto"><h1>🌙 訓練評価ナビ</h1><small>4日間の予定・移動・休憩・進捗をひとまとめ</small></div></header><main class="wrap"><section class="panel"><div class="top"><label style="margin:0" for="person">評価者</label><select id="person" style="width:auto;min-width:155px"></select></div><div class="days" id="days"></div><div class="top"><b id="dayLabel">1日目</b><span class="muted" id="counts"></span></div><div class="bar"><div class="fill" id="progress"></div></div><div class="muted" id="overall"></div></section><section class="panel"><div class="top"><h2 style="font-size:18px;margin:0">予定一覧</h2><button id="add">＋ 予定を追加</button></div><div id="items"></div></section><section class="panel"><h2 style="font-size:17px;margin:0 0 12px">データ管理</h2><div class="tools"><button class="secondary" id="export">バックアップを保存</button><button class="secondary" id="import">バックアップを読み込む</button><input type="file" id="file" accept="application/json,.json" hidden><button class="danger" id="reset">この評価者の予定を全削除</button></div><p class="muted">データはこのブラウザ内に保存されます。別端末には自動同期されません。定期的にバックアップしてください。</p></section><footer>※ 業務利用時は社内ルールに従ってください。機密情報は許可なく入力しないでください。</footer></main><dialog id="editor"><form id="form"><h2 id="formTitle" style="margin:0">予定を追加</h2><label for="time">開始時刻</label><input id="time" type="time" required><label for="end">終了時刻</label><input id="end" type="time" required><label for="kind">種類</label><select id="kind"><option>評価</option><option>移動</option><option>休憩</option><option>打ち合わせ</option><option>その他</option></select><label for="title">実施内容</label><input id="title" maxlength="120" required placeholder="例：A地点で訓練評価"><label for="place">場所</label><input id="place" maxlength="100" placeholder="例：A地点"><label for="memo">メモ</label><textarea id="memo" placeholder="持ち物や注意事項など"></textarea><div class="actions"><button type="button" class="secondary" id="cancel">キャンセル</button><button type="submit">保存</button></div></form></dialog><script>
(()=>{'use strict';const KEY='training-eval-nav-v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}if(!state||!Array.isArray(state.people))state={people:Array.from({length:5},(_,i)=>({name:`評価者${i+1}`,days:[[],[],[],[]]}))};let person=0,day=0,editing=null;const $=id=>document.getElementById(id);const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('保存できませんでした。ブラウザの保存設定を確認してください。')}};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const p=state.people[person];$('person').innerHTML=state.people.map((x,i)=>`<option value="${i}">${esc(x.name)}</option>`).join('');$('person').value=person;$('days').innerHTML=[0,1,2,3].map(i=>`<button class="${day===i?'active':''}" data-day="${i}">${i+1}日目</button>`).join('');$('dayLabel').textContent=`${day+1}日目`;const list=p.days[day].slice().sort((a,b)=>a.time.localeCompare(b.time)||a.end.localeCompare(b.end));const count=list.filter(x=>x.done).length;const all=p.days.flat(),total=all.filter(x=>x.done).length;$('counts').textContent=`${count} / ${list.length}件完了 (${list.length?Math.round(count/list.length*100):0}%)`;$('progress').style.width=`${list.length?count/list.length*100:0}%`;$('overall').textContent=`4日間の総進捗：${total} / ${all.length}件 (${all.length?Math.round(total/all.length*100):0}%)`;$('items').innerHTML=list.length?list.map(x=>`<div class="item ${x.done?'done':''}"><input type="checkbox" aria-label="${esc(x.title)}を完了" data-check="${esc(x.id)}" ${x.done?'checked':''}><div class="itemmain"><div class="meta">${esc(x.time)}〜${esc(x.end)}　<span class="tag">${esc(x.kind)}</span></div><div class="itemtitle">${esc(x.title)}</div><div class="meta">📍 ${esc(x.place||'場所未設定')}</div>${x.memo?`<div class="muted">${esc(x.memo)}</div>`:''}<div class="itembuttons"><button class="secondary" data-edit="${esc(x.id)}">編集</button><button class="danger" data-delete="${esc(x.id)}">削除</button></div></div></div>`).join(''):'<div class="empty">まだ予定がありません。<br>「＋ 予定を追加」から入力してね。</div>'}const current=()=>state.people[person].days[day];function open(id=null){editing=id;const x=current().find(a=>a.id===id);$('formTitle').textContent=x?'予定を編集':'予定を追加';$('time').value=x?.time||'09:00';$('end').value=x?.end||'10:00';$('kind').value=x?.kind||'評価';$('title').value=x?.title||'';$('place').value=x?.place||'';$('memo').value=x?.memo||'';$('editor').showModal()}$('person').addEventListener('change',e=>{person=Number(e.target.value);render()});$('days').addEventListener('click',e=>{const b=e.target.closest('[data-day]');if(b){day=Number(b.dataset.day);render()}});$('add').onclick=()=>open();$('cancel').onclick=()=>$('editor').close();$('form').onsubmit=e=>{e.preventDefault();const x={id:editing||('id-'+Date.now()+'-'+Math.random().toString(36).slice(2)),time:$('time').value,end:$('end').value,kind:$('kind').value,title:$('title').value.trim(),place:$('place').value.trim(),memo:$('memo').value.trim(),done:false};if(!x.title)return alert('実施内容を入力してください');if(x.end<=x.time)return alert('終了時刻は開始時刻より後にしてください');const arr=current(),idx=arr.findIndex(a=>a.id===editing);if(idx>=0)x.done=arr[idx].done,arr[idx]=x;else arr.push(x);save();$('editor').close();render()};$('items').addEventListener('change',e=>{const id=e.target.dataset.check;if(!id)return;const x=current().find(a=>a.id===id);if(x){x.done=e.target.checked;save();render()}});$('items').addEventListener('click',e=>{const edit=e.target.closest('[data-edit]'),del=e.target.closest('[data-delete]');if(edit)open(edit.dataset.edit);if(del&&confirm('この予定を削除しますか？')){state.people[person].days[day]=current().filter(a=>a.id!==del.dataset.delete);save();render()}});$('export').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='訓練評価ナビ_バックアップ.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const obj=JSON.parse(await f.text());if(!Array.isArray(obj.people)||obj.people.length!==5||!obj.people.every(p=>Array.isArray(p.days)&&p.days.length===4&&p.days.every(Array.isArray)))throw Error('形式が違います');if(confirm('現在の全データをバックアップ内容で上書きしますか？')){state=obj;person=0;day=0;save();render()}}catch(err){alert('読み込みできません：'+err.message)}e.target.value=''};$('reset').onclick=()=>{if(confirm(`${state.people[person].name}の4日間の予定をすべて削除します。よろしいですか？`)){state.people[person].days=[[],[],[],[]];save();render()}};render()})();
</script></body></html>
